<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        body {
            background: url('{{ url_for('static', filename='background.jpg') }}') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Arial', sans-serif;
        }

        .overlay-background {
            background-color: rgba(255, 255, 255, 0.8); /* White background with 80% opacity */
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center contents vertically */
            min-height: 100vh; /* Ensure the container takes at least the full viewport height */
        }

        .navbar {
            background-color: #343a40;
        }

        .navbar-brand {
            color: #ffffff !important;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .card-container {
            display: flex;
            flex-direction: column; /* Align cards vertically */
            align-items: center; /* Center cards horizontally */
            gap: 20px; /* Add space between cards */
            padding: 20px; /* Add padding around the container */
        }

        .card {
            width: 300px; /* Set a fixed width for the cards */
            background-color: #ffffff; /* White background for the card */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Add a shadow effect */
            border-radius: 10px; /* Rounded corners */
            padding: 15px; /* Add padding inside the card */
            transition: transform 0.3s ease, box-shadow 0.3s ease; /* Smooth hover effect */
        }

        .card:hover {
            transform: translateY(-5px); /* Lift the card slightly on hover */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); /* Enhance shadow on hover */
        }

        .card-header {
            background-color: #007bff; /* Blue background for the header */
            color: #ffffff; /* White text color */
            padding: 10px; /* Add padding to the header */
            border-top-left-radius: 10px; /* Match the card's border radius */
            border-top-right-radius: 10px;
        }

        .card-body {
            padding: 10px; /* Add padding to the body */
        }

        .footer {
            background-color: #343a40;
            color: #ffffff;
            padding: 20px 0;
            margin-top: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">Parking Management System</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4 overlay-background">
        <h1 class="text-center mb-4">Welcome to Parking Management System</h1>
        <div class="card-container">
            <!-- Add Vehicle Card -->
            <div class="card">
                <div class="card-header">
                    Add Vehicle
                </div>
                <div class="card-body">
                    <a href="{{ url_for('add') }}" class="btn btn-primary w-100">Add Vehicle Details</a>
                </div>
            </div>
            <!-- Search Vehicle Card -->
            <div class="card">
                <div class="card-header">
                    Search Vehicle
                </div>
                <div class="card-body">
                    <a href="{{ url_for('search') }}" class="btn btn-primary w-100">Search Vehicle Details</a>
                </div>
            </div>
            <!-- Modify Vehicle Card -->
            <div class="card">
                <div class="card-header">
                    Modify Vehicle
                </div>
                <div class="card-body">
                    <a href="{{ url_for('modify') }}" class="btn btn-primary w-100">Modify Vehicle Details</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer text-center">
        <p>Done by Yeshwanth Raghavendar. R</p>
    </footer>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
