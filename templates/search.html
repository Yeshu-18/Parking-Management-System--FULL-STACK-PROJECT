<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Vehicle</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS for additional styling -->
    <style>
        body {
            background-color: #f8f9fa; /* Light gray background */
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #343a40; /* Dark gray text */
        }
        .form-container {
            background-color: #ffffff; /* White background for the form */
            padding: 30px;
            border-radius: 10px; /* Rounded corners */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Subtle shadow */
            max-width: 500px; /* Limit form width */
            margin: 0 auto; /* Center the form */
        }
        .form-label {
            font-weight: bold;
            color: #343a40; /* Dark gray text */
        }
        .form-control {
            margin-bottom: 20px; /* Space between form elements */
        }
        .btn-primary {
            background-color: #007bff; /* Blue button */
            border-color: #007bff;
            width: 100%; /* Full-width button */
            padding: 10px;
            font-size: 16px;
        }
        .btn-primary:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }
        .btn-back {
            display: block;
            width: 150px;
            margin: 20px auto; /* Center the button */
            text-align: center;
            background-color: #6c757d; /* Gray button */
            color: #ffffff; /* White text */
            padding: 10px;
            border-radius: 5px; /* Rounded corners */
            text-decoration: none; /* Remove underline */
        }
        .btn-back:hover {
            background-color: #5a6268; /* Darker gray on hover */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Search Vehicle Details</h1>
        <div class="form-container">
            <form method="POST">
                <div class="mb-3">
                    <label for="choice" class="form-label">Choose an option:</label>
                    <select class="form-control" id="choice" name="choice">
                        <option value="1">Display all vehicles</option>
                        <option value="2">Search for a vehicle</option>
                        <option value="3">See parked vehicles</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="v_no" class="form-label">Vehicle Number (if applicable):</label>
                    <input type="text" class="form-control" id="v_no" name="v_no">
                </div>
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
        </div>
        <a href="{{ url_for('index') }}" class="btn-back">Back to Home</a>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
